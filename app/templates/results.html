{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-lg-12">
        <a href="/" class="btn btn-secondary btn-sm mb-3">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        <h1 class="mb-0">
            <i class="fas fa-chart-bar"></i> Simulation Results
        </h1>
    </div>
</div>

<div class="row mb-4">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <h3 id="resultsTitle">Loading...</h3>
                        <p class="text-muted" id="resultsDescription"></p>
                    </div>
                    <div class="col-md-4 text-end">
                        <a href="#" id="backToSimBtn" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-arrow-right"></i> Back to Simulation
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-12">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Output Files</h5>
            </div>
            <div class="card-body">
                <div id="outputFilesList" class="list-group">
                    <div class="text-muted p-3 text-center">
                        <i class="fas fa-hourglass-end"></i> Loading output files...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-12">
        <div class="card mb-4">
            <div class="card-header">
                <ul class="nav nav-tabs card-header-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="meshTab" data-bs-toggle="tab" 
                                data-bs-target="#meshContent" type="button" role="tab">
                            <i class="fas fa-th"></i> Mesh
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="dataTab" data-bs-toggle="tab" 
                                data-bs-target="#dataContent" type="button" role="tab">
                            <i class="fas fa-database"></i> Solution Data
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="plotsTab" data-bs-toggle="tab" 
                                data-bs-target="#plotsContent" type="button" role="tab">
                            <i class="fas fa-chart-line"></i> Plots
                        </button>
                    </li>
                </ul>
            </div>
            <div class="card-body">
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="meshContent" role="tabpanel">
                        <div id="meshVisualization" class="text-muted p-5 text-center">
                            <i class="fas fa-th fa-3x opacity-25"></i>
                            <p class="mt-2">Mesh visualization will appear here</p>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="dataContent" role="tabpanel">
                        <div id="solutionDataView" class="text-muted p-5 text-center">
                            <i class="fas fa-database fa-3x opacity-25"></i>
                            <p class="mt-2">Solution data will appear here</p>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="plotsContent" role="tabpanel">
                        <div id="plotsVisualization" class="text-muted p-5 text-center">
                            <i class="fas fa-chart-line fa-3x opacity-25"></i>
                            <p class="mt-2">Plots will appear here</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const simId = '{{ sim_id }}';
</script>
<script src="{{ url_for('static', filename='js/results.js') }}"></script>
{% endblock %}
